{% extends 'base.html' %}
{% block content %}
<main class="login-shell">
  <img src="/static/icon.svg" width="64" height="64" alt="">
  <p class="eyebrow">MY ETF PORTFOLIO</p>
  <h1>투자의 흐름을,<br>한눈에.</h1>
  <p class="muted">나의 ETF와 수익률을 확인하는 작은 투자 노트</p>
  {% if setup %}
  <div class="notice">접속 암호를 설정한 뒤 사용할 수 있습니다. 서버의 <code>APP_PASSWORD</code> 환경변수를 설정해 주세요.</div>
  {% else %}
  <form action="/login" method="post" class="panel login-form">
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <label for="password">나의 접속 암호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    {% if error %}<p role="alert" class="negative">{{ error }}</p>{% endif %}
    <button type="submit">포트폴리오 열기 <span aria-hidden="true">↗</span></button>
  </form>
  {% endif %}
  <p class="hint">아이폰 Safari의 공유 메뉴에서 ‘홈 화면에 추가’를 선택하세요.</p>
</main>
{% endblock %}
